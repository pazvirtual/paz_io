name: build
on: [push, pull_request]
jobs:
  windows-ucrt64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Build and Test
        run: make -j
      - uses: actions/upload-artifact@v4
        with:
          name: windows-ucrt64-build
          path: |
            libpazio.a
            util/paz-archive.exe
  windows-clang64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: make mingw-w64-clang-x86_64-clang
      - name: Build and Test
        run: make -j
      - uses: actions/upload-artifact@v4
        with:
          name: windows-clang64-build
          path: |
            libpazio.a
            util/paz-archive.exe
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and Test
        run: make -j
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            libpazio.a
            util/paz-archive
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and Test
        run: make -j
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            libpazio.a
            util/paz-archive
